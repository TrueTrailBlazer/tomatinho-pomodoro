<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <filter id="nightGlowAlone" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="3.5" flood-color="#FF385C" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Little Night Accents (sem fundo de card): lua e estrelinha flutuando perto do tomatinho -->
  <path d="M96 18 C91 18 86 22 86 28 C86 35 91 40 98 40 C99.5 40 101 39.5 102 38.8 C98 42.5 91 41 89 35 C87 30 90 23.5 96 20 C96.5 19.6 96 18 96 18 Z" 
        fill="#FFD43B" />
  <g fill="#748FFC" opacity="0.9">
    <path d="M28 26 L29.2 29.5 L32.5 30.7 L29.2 32 L28 35.5 L26.8 32 L23.5 30.7 L26.8 29.5 Z" />
    <circle cx="20" cy="50" r="1.5" fill="#FFE066" />
  </g>

  <!-- Tomato Body com tom aconchegante noturno -->
  <g filter="url(#nightGlowAlone)">
    <path d="M64 42 C40 42 24 56 24 80 C24 104 42 118 64 118 C86 118 104 104 104 80 C104 56 88 42 64 42 Z" 
          fill="#FF3B5C"/>
    <!-- Shadow de base noturna -->
    <path d="M33 91 C42 108 54 118 64 118 C74 118 86 108 95 91 C83 102 45 102 33 91 Z" 
          fill="#C92A2A" opacity="0.75"/>
  </g>

  <!-- Stem / Folhas (verde esmeralda suave) -->
  <g fill="#38D9A9" stroke="#12B886" stroke-width="1.8" stroke-linejoin="round">
    <path d="M64 42 C64 32 68 24 73 23 C74 25 71 34 67 43 Z" fill="#12B886" />
    <path d="M64 44 C57 34 46 36 43 41 C50 44 56 44 64 46 Z" />
    <path d="M64 44 C71 34 82 36 85 41 C78 44 72 44 64 46 Z" />
    <path d="M64 45 C60 51 51 55 48 53 C52 49 57 47 64 46 Z" />
    <path d="M64 45 C68 51 77 55 80 53 C76 49 71 47 64 46 Z" />
  </g>

  <!-- Brilho luar suave -->
  <ellipse cx="44" cy="59" rx="7.5" ry="4" transform="rotate(-28 44 59)" fill="#EBFBEE" opacity="0.45" />

  <!-- Olhinhos fechados e serenos dormindo -->
  <path d="M42 77 Q48 70 54 77" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" fill="none"/>
  <path d="M74 77 Q80 70 86 77" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" fill="none"/>

  <!-- Bochechinhas rosadas brilhantes no escuro -->
  <ellipse cx="38" cy="84" rx="5.5" ry="3.2" fill="#FF8787" opacity="0.8" />
  <ellipse cx="90" cy="84" rx="5.5" ry="3.2" fill="#FF8787" opacity="0.8" />

  <!-- Boquinha serena de sono -->
  <path d="M59 83 Q64 88 69 83" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" fill="none"/>

  <!-- "z" do soninho -->
  <text x="88" y="58" font-family="sans-serif" font-weight="900" font-size="13" fill="#FFD43B" opacity="0.95">z</text>
</svg>