<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <radialGradient id="tomatoGrad" cx="38%" cy="32%" r="65%">
      <stop offset="0%" stop-color="#FF6B6B" />
      <stop offset="45%" stop-color="#FA5252" />
      <stop offset="85%" stop-color="#E03131" />
      <stop offset="100%" stop-color="#C92A2A" />
    </radialGradient>

    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#69DB7C" />
      <stop offset="100%" stop-color="#2B8A3E" />
    </linearGradient>
  </defs>

  <!-- Corpo do Tomate Full-Bleed (Grande e volumoso) -->
