  <path d="M 64 25 C 78 22, 96 16, 100 26 C 92 30, 80 30, 70 28 Z" fill="url(#leafGrad)" />
  <path d="M 64 25 C 54 30, 44 38, 48 44 C 52 40, 58 35, 64 30 Z" fill="#2B8A3E" />
  <path d="M 64 25 C 74 30, 84 38, 80 44 C 76 40, 70 35, 64 30 Z" fill="#2B8A3E" />
  <path d="M 64 25 C 63 16, 60 6, 52 2 C 58 2, 68 8, 67 25 Z" fill="url(#leafGrad)" />

  <!-- Rostinho Fofo (Kawaii) -->
